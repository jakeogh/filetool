[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "firefoxtool"
version = "1!0.0.1793652951"
description = "Launch sandboxed firefox-bin with a managed profile"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "click",
]
license = "ISC"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/jakeogh/firefoxtool"

[project.scripts]
firefoxtool = "firefoxtool.firefoxtool:cli"

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
exclude = [
    "tests",
]

[tool.setuptools.package-data]
firefoxtool = [
    "py.typed",
]
